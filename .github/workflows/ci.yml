name: CI
on:
  push:
    branches: [main]
  pull_request:

# a new push to a pull request cancels that pull request's run still in progress (its result is superseded);
# runs on main are never cancelled, so every main commit keeps its own result
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      greenmail:
        image: greenmail/standalone:2.1.3
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose
        ports: ['3143:3143']
      clamav:
        image: clamav/clamav-debian:1.4
        ports: ['3310:3310']
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_IMAP_HOST: localhost
      TEST_IMAP_PORT: '3143'
      TEST_CLAMD_HOST: localhost
      TEST_CLAMD_PORT: '3310'
      TEST_S3_ENDPOINT: http://localhost:8333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: No-send static check (TC-OUT-09)
        run: npm run check:no-send
      - name: Licence policy
        run: npm run check:licences
      - name: Shared design variables unchanged (docs/09_UI_DESIGN.md §11.2)
        run: npm run check:tokens
      - name: No old product names outside the historical records
        run: npm run check:old-names
      - name: Released migrations unchanged (tech design §7)
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then git fetch --depth=1 origin "$GITHUB_BASE_REF"; elif [ -n "${BASE_SHA//0/}" ]; then git fetch --depth=1 origin "$BASE_SHA"; else git fetch --depth=2 origin "$GITHUB_SHA"; fi
          npm run check:migrations
        env:
          BASE_SHA: ${{ github.event.before }}
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Oracle self-check (independent Python implementation)
        run: npm run oracle:selfcheck
      - name: Start SeaweedFS (S3-compatible test store with versioning; a service container cannot take the "server" argument)
        run: |
          docker run -d -p 8333:8333 chrislusf/seaweedfs:4.50 server -s3
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8333/ && exit 0; sleep 2; done; exit 1
      - name: Wait for ClamAV
        run: for i in $(seq 1 60); do (echo PING | nc -w 2 localhost 3310 | grep -q PONG) && exit 0; sleep 5; done; exit 1
      - name: Install Playwright system dependencies (Chromium)
        timeout-minutes: 30
        run: |
          # Avoid the slow Azure HTTP mirror; keep Ubuntu's signed packages.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          # Do not timeout/retry the npm parent while its apt child still owns dpkg's lock.
          npx playwright install-deps chromium
      - name: Install Playwright browsers (Chromium)
        timeout-minutes: 15
        run: npx playwright install chromium
      - name: Unit, integration, TS-vs-oracle and browser tests (the parser container runs in the parser job)
        run: |
          npx vitest run --exclude parser/container.test.ts --exclude parser/profiles.test.ts --reporter=default --reporter=json --outputFile=test-report.json
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-check
          path: |
            test-report.json
            e2e-report.json
          retention-days: 7
      - name: Evaluation, development set on recorded model replies (PRD §6 E2 metrics, test plan §4.3)
        run: npm run eval
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  # the parser container under its dedicated profiles on a host with AppArmor (tech design T7, v0.7.11; TC-ING-10,
  # TC-OPS-02). The user-namespace restriction of Ubuntu 24.04 is left on: the trunks-parser profile allows bubblewrap.
  parser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: AppArmor is on, the user-namespace restriction unchanged
        run: |
          aa-enabled
          sysctl kernel.apparmor_restrict_unprivileged_userns
      - name: Build the parser image (bubblewrap)
        run: docker build -t trunks-parser-test -f parser/Dockerfile .
      - name: What the parser needs beyond the profile (complain mode, logged only; the tests below run in enforce mode)
        run: |
          sudo apparmor_parser -r -W -C deploy/apparmor/trunks-parser
          npx vitest run parser/container.test.ts > /dev/null 2>&1 || true
          sudo dmesg | grep 'apparmor="ALLOWED"' | grep 'profile="trunks-parser' | sed -E 's/.* (operation=.*)/\1/' | sed -E 's/ pid=[0-9]+//' | sort | uniq -c || true
      - name: Load the trunks-parser profile (enforce)
        run: |
          sudo apparmor_parser -r -W deploy/apparmor/trunks-parser
          sudo aa-status | grep -E '^\s+trunks-parser$'
      - name: Parser container and profiles
        env:
          PARSER_APPARMOR: '1'
        run: npx vitest run parser/container.test.ts parser/profiles.test.ts --reporter=default --reporter=json --outputFile=parser-report.json
      - name: AppArmor denials (on failure)
        if: failure()
        run: sudo dmesg | grep -i apparmor | tail -50 || sudo journalctl -k | grep -i apparmor | tail -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-parser
          path: parser-report.json
          retention-days: 7

  # the compose stacks (tech design v0.7.11): the demo offline and against the evaluation, sign-in in WebKit and
  # Chromium, a real start, a failed migration, key rotation; then the static snapshot under the site CSP (TC-DEMO-04)
  # runs next to `check`, not after it: it makes its own evaluation export for TC-DEMO-01 (replay, no model call)
  compose:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # TC-OPS-07 upgrades from the code before E5 (8ad8e91); a shallow checkout fails the test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the trunks-parser AppArmor profile as the quick start says
        run: sudo cp deploy/apparmor/trunks-parser /etc/apparmor.d/trunks-parser && sudo apparmor_parser -r -W /etc/apparmor.d/trunks-parser
      - name: Build the images
        run: docker compose build
      - name: Install Playwright system dependencies (Chromium, WebKit)
        timeout-minutes: 30
        run: |
          # Avoid the slow Azure HTTP mirror; keep Ubuntu's signed packages.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          # Do not timeout/retry the npm parent while its apt child still owns dpkg's lock.
          npx playwright install-deps chromium webkit
      - name: Install Playwright browsers (Chromium, WebKit)
        timeout-minutes: 15
        run: npx playwright install chromium webkit
      - name: The evaluation's export of the demo samples (TC-DEMO-01 compares the demo with it)
        run: EVAL_ACTUAL_DIR=eval-actual npm run eval
      - name: Compose tests
        env:
          EVAL_ACTUAL_DIR: eval-actual
        run: npm run test:compose
      - name: Static demo snapshot under the site CSP (TC-DEMO-04)
        run: npx playwright test -c playwright.demo.config.ts
      - name: Container logs (on failure)
        if: failure()
        run: for p in $(docker compose ls -aq); do docker compose -p "$p" logs --tail 80; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-compose
          path: |
            compose-report.json
            demo-e2e-report.json
          retention-days: 7

  # milestone coverage over every job's reports (rules D4, test plan §1; tech design v0.7.11)
  coverage:
    needs: [check, parser, compose]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # check and compose run side by side now: green coverage requires every job to have succeeded, not only the
      # reports it reads (a failed evaluation step in check, a cancelled job) (CI review CI-01)
      - name: Every job succeeded
        env:
          CHECK: ${{ needs.check.result }}
          PARSER: ${{ needs.parser.result }}
          COMPOSE: ${{ needs.compose.result }}
        run: |
          echo "check=$CHECK parser=$PARSER compose=$COMPOSE"
          test "$CHECK" = success && test "$PARSER" = success && test "$COMPOSE" = success
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check-coverage.mjs: TC-OPS-07 is exempt only where the history truly lacks 8ad8e91
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: true
      - name: Every case due at this milestone ran and passed
        run: node scripts/check-coverage.mjs test-report.json e2e-report.json parser-report.json compose-report.json demo-e2e-report.json
